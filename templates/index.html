<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2022 개정 교육과정 평가계획서 생성기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Malgun Gothic', sans-serif; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-header { background-color: #0d6efd; color: white; border-radius: 12px 12px 0 0 !important; font-weight: bold; }
        .perf-card { border: 1px solid #dee2e6; border-left: 5px solid #0d6efd; background-color: #ffffff; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .btn-remove { color: #dc3545; cursor: pointer; float: right; font-size: 1.2rem; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; color: white; flex-direction: column; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 900px;">
    <h2 class="text-center mb-4 fw-bold text-primary">2022 개정 교육과정 평가계획서 자동 생성기</h2>

    <form id="evalForm">
        <!-- 1. API 키 입력 -->
        <div class="card">
            <div class="card-header">1. Gemini API 키</div>
            <div class="card-body">
                <input type="password" class="form-control" id="apiKey" name="apiKey" placeholder="Gemini API 키를 입력하세요" required>
            </div>
        </div>

        <!-- 2. 학교 및 교과 정보 -->
        <div class="card">
            <div class="card-header">2. 기본 정보 설정</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">학교급</label>
                        <select class="form-select" id="schoolType" name="schoolType" onchange="loadSubjects()">
                            <option value="high" selected>고등학교</option>
                            <option value="middle">중학교</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">학년</label>
                        <select class="form-select" id="grade" name="grade">
                            <option value="1">1학년</option>
                            <option value="2">2학년</option>
                            <option value="3">3학년</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">학기</label>
                        <select class="form-select" id="semester" name="semester">
                            <option value="1학기">1학기</option>
                            <option value="2학기">2학기</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">교과군</label>
                        <select class="form-select" id="mainSubject" name="교과" onchange="onMainSubjectChange()">
                            <!-- JS 로드 -->
                        </select>
                    </div>
                    <div class="col-md-6" id="detailSubjectGroup">
                        <label class="form-label">세부 교과목</label>
                        <select class="form-select" id="detailSubject" name="세부교과" onchange="loadStandards()">
                            <!-- JS 로드 -->
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 해당 학기 성취기준 선택 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>3. 학기 교육과정 성취기준 선택</span>
                <div class="form-check form-check-inline text-white mb-0 fs-6">
                    <input class="form-check-input" type="checkbox" id="selectAllSemester" onchange="toggleSelectAll('semester', this.checked)" checked>
                    <label class="form-check-label text-white fw-bold" for="selectAllSemester">전체 선택</label>
                </div>
            </div>
            <div class="card-body">
                <p class="text-muted small mb-2">* 이번 학기에 평가할 성취기준을 먼저 선택하세요. 선택한 성취기준만 아래 정기시험 및 수행평가에서 선택할 수 있습니다.</p>
                <div id="semesterStandards" class="border p-2 bg-light rounded" style="max-height: 180px; overflow-y: auto;">
                    <!-- JS 로드 -->
                </div>
            </div>
        </div>

        <!-- 4. 정기시험 정보 -->
        <div class="card">
            <div class="card-header">4. 정기시험 (지필평가) 비율 및 성취기준</div>
            <div class="card-body">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">1차 정기시험 비율 (%)</label>
                        <input type="number" class="form-control" id="exam1Ratio" value="30" min="0" max="100">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">2차 정기시험 비율 (%)</label>
                        <input type="number" class="form-control" id="exam2Ratio" value="30" min="0" max="100">
                    </div>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-bold mb-0">1차 정기시험 반영 성취기준</label>
                        <div class="form-check form-check-inline mb-0">
                            <input class="form-check-input" type="checkbox" id="selectAllExam1" onchange="toggleSelectAll('exam1', this.checked)">
                            <label class="form-check-label small fw-bold" for="selectAllExam1">전체 선택</label>
                        </div>
                    </div>
                    <div id="exam1Standards" class="border p-2 bg-light rounded" style="max-height: 140px; overflow-y: auto;"></div>
                </div>
                <div>
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-bold mb-0">2차 정기시험 반영 성취기준</label>
                        <div class="form-check form-check-inline mb-0">
                            <input class="form-check-input" type="checkbox" id="selectAllExam2" onchange="toggleSelectAll('exam2', this.checked)">
                            <label class="form-check-label small fw-bold" for="selectAllExam2">전체 선택</label>
                        </div>
                    </div>
                    <div id="exam2Standards" class="border p-2 bg-light rounded" style="max-height: 140px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>

        <!-- 5. 수행평가 정보 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>5. 수행평가 영역 및 세부 채점 요소 설정</span>
                <button type="button" class="btn btn-sm btn-light text-primary fw-bold" onclick="addPerfArea()">+ 수행평가 영역 추가</button>
            </div>
            <div class="card-body" id="perfContainer">
                <!-- 수행평가 영역들이 동적으로 추가됨 -->
            </div>
        </div>

        <button type="button" class="btn btn-primary btn-lg w-100 fw-bold my-4" onclick="submitForm()">평가계획서 (Word) 생성 및 다운로드</button>
    </form>
</div>

<!-- 로딩 오버레이 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-border text-light mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
    <h4 id="loadingText">2022 개정 교육과정 평가계획서를 작성 중입니다...</h4>
    <p class="text-light">Gemini AI가 세부 루브릭과 채점기준을 분석하고 있습니다.</p>
</div>

<script>
let subjectHierarchy = {};
let allSubjectStandards = [];
let perfCount = 0;

document.addEventListener("DOMContentLoaded", function() {
    loadSubjects();
});

function loadSubjects() {
    const schoolType = document.getElementById('schoolType').value;
    const detailSelect = document.getElementById('detailSubject');

    fetch('/get_subjects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ schoolType })
    })
    .then(res => res.json())
    .then(data => {
        if (!data.success) return;
        const mainSelect = document.getElementById('mainSubject');
        mainSelect.innerHTML = '';

        if (schoolType === 'middle') {
            document.getElementById('detailSubjectGroup').style.display = 'none';
            detailSelect.innerHTML = '';
            data.subjects.forEach(sub => {
                mainSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
            });
        } else {
            document.getElementById('detailSubjectGroup').style.display = 'block';
            subjectHierarchy = data.hierarchy || {};
            data.subjects.forEach(sub => {
                mainSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
            });
        }
        onMainSubjectChange();
    });
}

function onMainSubjectChange() {
    const schoolType = document.getElementById('schoolType').value;
    const mainSubject = document.getElementById('mainSubject').value;
    const detailSelect = document.getElementById('detailSubject');

    if (schoolType === 'high' && subjectHierarchy[mainSubject]) {
        detailSelect.innerHTML = '';
        subjectHierarchy[mainSubject].forEach(sub => {
            detailSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
        });
    } else {
        detailSelect.innerHTML = '';
    }
    loadStandards();
}

function loadStandards() {
    const schoolType = document.getElementById('schoolType').value;
    const mainSubject = document.getElementById('mainSubject').value;
    const detailSubject = schoolType === 'high' ? document.getElementById('detailSubject').value : '';

    fetch('/get_standards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ schoolType, 교과: mainSubject, 세부교과: detailSubject })
    })
    .then(res => res.json())
    .then(data => {
        if (!data.success) return;
        allSubjectStandards = data.standards || [];
        
        renderSemesterStandards();
        document.getElementById('selectAllSemester').checked = true;
    });
}

function renderSemesterStandards() {
    const container = document.getElementById('semesterStandards');
    container.innerHTML = '';
    
    if (allSubjectStandards.length === 0) {
        container.innerHTML = '<span class="text-muted small">등록된 성취기준이 없습니다.</span>';
        onSemesterStandardsChange();
        return;
    }

    allSubjectStandards.forEach((std, i) => {
        container.innerHTML += `
            <div class="form-check">
                <input class="form-check-input semester-std" type="checkbox" value="${escapeHtml(std)}" id="sem_${i}" onchange="onSemesterStandardsChange()" checked>
                <label class="form-check-label" for="sem_${i}">${escapeHtml(std)}</label>
            </div>
        `;
    });

    onSemesterStandardsChange();
}

function getSelectedSemesterStandards() {
    const checked = document.querySelectorAll('.semester-std:checked');
    return Array.from(checked).map(c => c.value);
}

function onSemesterStandardsChange() {
    const allBoxes = document.querySelectorAll('.semester-std');
    const checkedBoxes = document.querySelectorAll('.semester-std:checked');
    const selectAllSem = document.getElementById('selectAllSemester');
    if (allBoxes.length > 0) {
        selectAllSem.checked = (allBoxes.length === checkedBoxes.length);
    }

    const activeStds = getSelectedSemesterStandards();

    renderExamStandards(activeStds);
    refreshAllPerfStandards(activeStds);
}

function renderExamStandards(activeStds) {
    const prevE1 = new Set(Array.from(document.querySelectorAll('.exam1-std:checked')).map(c => c.value));
    const prevE2 = new Set(Array.from(document.querySelectorAll('.exam2-std:checked')).map(c => c.value));

    const e1 = document.getElementById('exam1Standards');
    const e2 = document.getElementById('exam2Standards');
    e1.innerHTML = ''; e2.innerHTML = '';

    if (activeStds.length === 0) {
        e1.innerHTML = '<span class="text-muted small">선택된 학기 성취기준이 없습니다.</span>';
        e2.innerHTML = '<span class="text-muted small">선택된 학기 성취기준이 없습니다.</span>';
        updateSelectAllStatus('exam1');
        updateSelectAllStatus('exam2');
        return;
    }

    activeStds.forEach((std, i) => {
        const isE1Checked = prevE1.has(std) ? 'checked' : '';
        const isE2Checked = prevE2.has(std) ? 'checked' : '';

        e1.innerHTML += `<div class="form-check"><input class="form-check-input exam1-std" type="checkbox" value="${escapeHtml(std)}" id="e1_${i}" ${isE1Checked} onchange="updateSelectAllStatus('exam1')"><label class="form-check-label" for="e1_${i}">${escapeHtml(std)}</label></div>`;
        e2.innerHTML += `<div class="form-check"><input class="form-check-input exam2-std" type="checkbox" value="${escapeHtml(std)}" id="e2_${i}" ${isE2Checked} onchange="updateSelectAllStatus('exam2')"><label class="form-check-label" for="e2_${i}">${escapeHtml(std)}</label></div>`;
    });

    updateSelectAllStatus('exam1');
    updateSelectAllStatus('exam2');
}

function addPerfArea() {
    perfCount++;
    const id = perfCount;
    const html = `
    <div class="perf-card" id="perf_card_${id}">
        <span class="btn-remove" onclick="removePerfArea(${id})">&times;</span>
        <h6 class="fw-bold text-primary mb-3">수행평가 영역 ${id}</h6>
        <div class="row g-3 mb-3">
            <div class="col-md-5">
                <label class="form-label">영역명 (비워두면 AI가 자동생성)</label>
                <input type="text" class="form-control perf-name" placeholder="예: 서술형 평가, 포트폴리오">
            </div>
            <div class="col-md-3">
                <label class="form-label">반영 비율 (%)</label>
                <input type="number" class="form-control perf-ratio" value="20" min="0" max="100">
            </div>
            <div class="col-md-4">
                <label class="form-label">영역 기본점수 (점)</label>
                <input type="number" class="form-control perf-base-score" value="0" min="0" placeholder="기본점수">
            </div>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label fw-bold mb-0">선택 성취기준</label>
                <div class="form-check form-check-inline mb-0">
                    <input class="form-check-input" type="checkbox" id="selectAllPerf_${id}" onchange="toggleSelectAll('perf_${id}', this.checked)">
                    <label class="form-check-label small fw-bold" for="selectAllPerf_${id}">전체 선택</label>
                </div>
            </div>
            <div class="perf-standards border p-2 bg-light rounded" style="max-height: 120px; overflow-y: auto;">
                ${getStandardsCheckboxesHtml(id)}
            </div>
        </div>

        <div class="mb-2 d-flex justify-content-between align-items-center">
            <label class="form-label fw-bold mb-0">세부 평가 요소 및 배점 설정</label>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addEvalElement(${id})">+ 평가 요소 추가</button>
        </div>
        <div class="table-responsive">
            <table class="table table-sm table-bordered text-center align-middle">
                <thead class="table-light">
                    <tr>
                        <th>평가 요소명</th>
                        <th style="width: 100px;">최고점</th>
                        <th style="width: 100px;">최저점</th>
                        <th style="width: 100px;">급간</th>
                        <th style="width: 50px;">삭제</th>
                    </tr>
                </thead>
                <tbody id="elem_tbody_${id}">
                    <tr>
                        <td><input type="text" class="form-control form-control-sm elem-name" placeholder="예: 개념 이해 및 식 세우기"></td>
                        <td><input type="number" class="form-control form-control-sm elem-max" value="5"></td>
                        <td><input type="number" class="form-control form-control-sm elem-min" value="1"></td>
                        <td><input type="number" class="form-control form-control-sm elem-step" value="2" placeholder="급간"></td>
                        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">&times;</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>`;
    document.getElementById('perfContainer').insertAdjacentHTML('beforeend', html);
    updateSelectAllStatus(`perf_${id}`);
}

function getStandardsCheckboxesHtml(perfId) {
    const activeList = getSelectedSemesterStandards();
    if (activeList.length === 0) {
        return '<span class="text-muted small">선택된 학기 성취기준이 없습니다.</span>';
    }
    return activeList.map((std, i) => `
        <div class="form-check">
            <input class="form-check-input perf-std-${perfId}" type="checkbox" value="${escapeHtml(std)}" id="p_${perfId}_${i}" onchange="updateSelectAllStatus('perf_${perfId}')">
            <label class="form-check-label" for="p_${perfId}_${i}">${escapeHtml(std)}</label>
        </div>
    `).join('');
}

function refreshAllPerfStandards(activeStds) {
    const perfContainer = document.getElementById('perfContainer');
    if (perfContainer.children.length === 0) {
        addPerfArea();
        return;
    }

    const activeList = activeStds || getSelectedSemesterStandards();
    const cards = document.querySelectorAll('.perf-card');

    cards.forEach(card => {
        const id = card.id.replace('perf_card_', '');
        const stdBox = card.querySelector('.perf-standards');
        const prevChecked = new Set(Array.from(card.querySelectorAll(`.perf-std-${id}:checked`)).map(c => c.value));

        if (stdBox) {
            if (activeList.length === 0) {
                stdBox.innerHTML = '<span class="text-muted small">선택된 학기 성취기준이 없습니다.</span>';
            } else {
                stdBox.innerHTML = activeList.map((std, i) => {
                    const isChecked = prevChecked.has(std) ? 'checked' : '';
                    return `
                        <div class="form-check">
                            <input class="form-check-input perf-std-${id}" type="checkbox" value="${escapeHtml(std)}" id="p_${id}_${i}" ${isChecked} onchange="updateSelectAllStatus('perf_${id}')">
                            <label class="form-check-label" for="p_${id}_${i}">${escapeHtml(std)}</label>
                        </div>
                    `;
                }).join('');
            }
            updateSelectAllStatus(`perf_${id}`);
        }
    });
}

function toggleSelectAll(targetGroup, isChecked) {
    if (targetGroup === 'semester') {
        document.querySelectorAll('.semester-std').forEach(cb => cb.checked = isChecked);
        onSemesterStandardsChange();
    } else if (targetGroup === 'exam1') {
        document.querySelectorAll('.exam1-std').forEach(cb => cb.checked = isChecked);
    } else if (targetGroup === 'exam2') {
        document.querySelectorAll('.exam2-std').forEach(cb => cb.checked = isChecked);
    } else if (targetGroup.startsWith('perf_')) {
        const perfId = targetGroup.replace('perf_', '');
        document.querySelectorAll(`.perf-std-${perfId}`).forEach(cb => cb.checked = isChecked);
    }
}

function updateSelectAllStatus(targetGroup) {
    let selector = '';
    let allCheckboxId = '';

    if (targetGroup === 'exam1') {
        selector = '.exam1-std';
        allCheckboxId = 'selectAllExam1';
    } else if (targetGroup === 'exam2') {
        selector = '.exam2-std';
        allCheckboxId = 'selectAllExam2';
    } else if (targetGroup.startsWith('perf_')) {
        const perfId = targetGroup.replace('perf_', '');
        selector = `.perf-std-${perfId}`;
        allCheckboxId = `selectAllPerf_${perfId}`;
    }

    if (selector && allCheckboxId) {
        const allBoxes = document.querySelectorAll(selector);
        const checkedBoxes = document.querySelectorAll(`${selector}:checked`);
        const targetCb = document.getElementById(allCheckboxId);
        if (targetCb) {
            targetCb.checked = (allBoxes.length > 0 && allBoxes.length === checkedBoxes.length);
        }
    }
}

function addEvalElement(perfId) {
    const tbody = document.getElementById(`elem_tbody_${perfId}`);
    const html = `
    <tr>
        <td><input type="text" class="form-control form-control-sm elem-name" placeholder="세부 평가 요소명"></td>
        <td><input type="number" class="form-control form-control-sm elem-max" value="5"></td>
        <td><input type="number" class="form-control form-control-sm elem-min" value="1"></td>
        <td><input type="number" class="form-control form-control-sm elem-step" value="2"></td>
        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">&times;</button></td>
    </tr>`;
    tbody.insertAdjacentHTML('beforeend', html);
}

function removePerfArea(id) {
    const card = document.getElementById(`perf_card_${id}`);
    if (card) card.remove();
}

function escapeHtml(text) {
    if (!text) return '';
    return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function submitForm() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) {
        alert('Gemini API 키를 입력해주세요.');
        return;
    }

    const schoolType = document.getElementById('schoolType').value;
    const mainSubject = document.getElementById('mainSubject').value;
    const detailSubject = schoolType === 'high' ? document.getElementById('detailSubject').value : '';

    const exam1Ratio = parseInt(document.getElementById('exam1Ratio').value || 0);
    const exam2Ratio = parseInt(document.getElementById('exam2Ratio').value || 0);

    const exam1Stds = Array.from(document.querySelectorAll('.exam1-std:checked')).map(c => c.value);
    const exam2Stds = Array.from(document.querySelectorAll('.exam2-std:checked')).map(c => c.value);

    const perfCards = document.querySelectorAll('.perf-card');
    const perfList = [];

    perfCards.forEach(card => {
        const perfId = card.id.replace('perf_card_', '');
        const name = card.querySelector('.perf-name').value.trim();
        const ratio = parseInt(card.querySelector('.perf-ratio').value || 0);
        const baseScore = parseInt(card.querySelector('.perf-base-score').value || 0);

        const stds = Array.from(card.querySelectorAll(`.perf-std-${perfId}:checked`)).map(c => c.value);

        const elemRows = card.querySelectorAll(`#elem_tbody_${perfId} tr`);
        const evalElements = [];

        elemRows.forEach(row => {
            evalElements.push({
                name: row.querySelector('.elem-name').value.trim(),
                maxScore: parseInt(row.querySelector('.elem-max').value || 5),
                minScore: parseInt(row.querySelector('.elem-min').value || 1),
                step: parseInt(row.querySelector('.elem-step').value || 2)
            });
        });

        perfList.push({
            name: name,
            ratio: ratio,
            baseScore: baseScore,
            standards: stds,
            evalElements: evalElements
        });
    });

    const formData = new FormData();
    formData.append('apiKey', apiKey);
    formData.append('schoolType', schoolType);
    formData.append('grade', document.getElementById('grade').value);
    formData.append('semester', document.getElementById('semester').value);
    formData.append('교과', mainSubject);
    formData.append('세부교과', detailSubject);
    formData.append('examRatios', JSON.stringify([exam1Ratio, exam2Ratio]));
    formData.append('examStandards', JSON.stringify({
        '1차 정기시험': exam1Stds,
        '2차 정기시험': exam2Stds
    }));
    formData.append('perfList', JSON.stringify(perfList));

    document.getElementById('loadingOverlay').style.display = 'flex';

    fetch('/generate', {
        method: 'POST',
        body: formData
    })
    .then(response => {
        document.getElementById('loadingOverlay').style.display = 'none';
        if (response.ok) {
            return response.blob().then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                // 오늘 날짜 및 시각(시분초) 포맷팅
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');

                const dateStr = `${year}${month}${day}`;
                const timeStr = `${hours}${minutes}${seconds}`;
                const fileNameSubject = detailSubject || mainSubject;

                // 파일명 설정: 평가계획서_과목명_날짜_시간.docx
                a.download = `평가계획서_${fileNameSubject}_${dateStr}_${timeStr}.docx`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            });
        } else {
            return response.json().then(err => {
                alert('생성 실패: ' + (err.error || '오류가 발생했습니다.'));
            });
        }
    })
    .catch(err => {
        document.getElementById('loadingOverlay').style.display = 'none';
        alert('요청 중 오류 발생: ' + err);
    });
}
</script>
</body>
</html>
