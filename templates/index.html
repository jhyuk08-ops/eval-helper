<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2022 개정 교육과정 평가계획서 생성기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Malgun Gothic', sans-serif; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-header { background-color: #0d6efd; color: white; border-radius: 12px 12px 0 0 !important; font-weight: bold; }
        .perf-card { border: 1px solid #dee2e6; border-left: 5px solid #0d6efd; background-color: #ffffff; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .btn-remove { color: #dc3545; cursor: pointer; float: right; font-size: 1.2rem; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; color: white; flex-direction: column; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 900px;">
    <h2 class="text-center mb-4 fw-bold text-primary">2022 개정 교육과정 평가계획서 자동 생성기</h2>

    <form id="evalForm">
        <!-- API 키 입력 -->
        <div class="card">
            <div class="card-header">1. Gemini API 키</div>
            <div class="card-body">
                <input type="password" class="form-control" id="apiKey" name="apiKey" placeholder="Gemini API 키를 입력하세요" required>
            </div>
        </div>

        <!-- 학교 및 교과 정보 -->
        <div class="card">
            <div class="card-header">2. 기본 정보 설정</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">학교급</label>
                        <select class="form-select" id="schoolType" name="schoolType" onchange="loadSubjects()">
                            <option value="high" selected>고등학교</option>
                            <option value="middle">중학교</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">학년</label>
                        <select class="form-select" id="grade" name="grade">
                            <option value="1">1학년</option>
                            <option value="2">2학년</option>
                            <option value="3">3학년</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">학기</label>
                        <select class="form-select" id="semester" name="semester">
                            <option value="1학기">1학기</option>
                            <option value="2학기">2학기</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">교과군</label>
                        <select class="form-select" id="mainSubject" name="교과" onchange="onMainSubjectChange()">
                            <!-- JS 로드 -->
                        </select>
                    </div>
                    <div class="col-md-6" id="detailSubjectGroup">
                        <label class="form-label">세부 교과목</label>
                        <select class="form-select" id="detailSubject" name="세부교과" onchange="loadStandards()">
                            <!-- JS 로드 -->
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 정기시험 정보 -->
        <div class="card">
            <div class="card-header">3. 정기시험 (지필평가) 비율 및 성취기준</div>
            <div class="card-body">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">1차 정기시험 비율 (%)</label>
                        <input type="number" class="form-control" id="exam1Ratio" value="30" min="0" max="100">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">2차 정기시험 비율 (%)</label>
                        <input type="number" class="form-control" id="exam2Ratio" value="30" min="0" max="100">
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label fw-bold">1차 정기시험 반영 성취기준 선택</label>
                    <div id="exam1Standards" class="border p-2 bg-light rounded" style="max-height: 150px; overflow-y: auto;"></div>
                </div>
                <div>
                    <label class="form-label fw-bold">2차 정기시험 반영 성취기준 선택</label>
                    <div id="exam2Standards" class="border p-2 bg-light rounded" style="max-height: 150px; overflow-y: auto;"></div>
                </div>
            </div>
        </div>

        <!-- 수행평가 정보 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>4. 수행평가 영역 및 세부 채점 요소 설정</span>
                <button type="button" class="btn btn-sm btn-light text-primary fw-bold" onclick="addPerfArea()">+ 수행평가 영역 추가</button>
            </div>
            <div class="card-body" id="perfContainer">
                <!-- 수행평가 영역들이 동적으로 추가됨 -->
            </div>
        </div>

        <button type="button" class="btn btn-primary btn-lg w-100 fw-bold my-4" onclick="submitForm()">평가계획서 (Word) 생성 및 다운로드</button>
    </form>
</div>

<!-- 로딩 오버레이 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-border text-light mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
    <h4 id="loadingText">2022 개정 교육과정 평가계획서를 작성 중입니다...</h4>
    <p class="text-light">Gemini AI가 세부 루브릭과 채점기준을 분석하고 있습니다.</p>
</div>

<script>
let subjectHierarchy = {};
let currentStandards = [];
let perfCount = 0;

document.addEventListener("DOMContentLoaded", function() {
    loadSubjects();
});

function loadSubjects() {
    const schoolType = document.getElementById('schoolType').value;
    fetch('/get_subjects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ schoolType })
    })
    .then(res => res.json())
    .then(data => {
        if (!data.success) return;
        const mainSelect = document.getElementById('mainSubject');
        mainSelect.innerHTML = '';

        if (schoolType === 'middle') {
            document.getElementById('detailSubjectGroup').style.display = 'none';
            data.subjects.forEach(sub => {
                mainSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
            });
        } else {
            document.getElementById('detailSubjectGroup').style.display = 'block';
            subjectHierarchy = data.hierarchy || {};
            data.subjects.forEach(sub => {
                mainSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
            });
        }
        onMainSubjectChange();
    });
}

function onMainSubjectChange() {
    const schoolType = document.getElementById('schoolType').value;
    const mainSubject = document.getElementById('mainSubject').value;
    const detailSelect = document.getElementById('detailSubject');

    if (schoolType === 'high' && subjectHierarchy[mainSubject]) {
        detailSelect.innerHTML = '';
        subjectHierarchy[mainSubject].forEach(sub => {
            detailSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
        });
    }
    loadStandards();
}

function loadStandards() {
    const schoolType = document.getElementById('schoolType').value;
    const mainSubject = document.getElementById('mainSubject').value;
    const detailSubject = document.getElementById('detailSubject').value;

    fetch('/get_standards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ schoolType, 교과: mainSubject, 세부교과: detailSubject })
    })
    .then(res => res.json())
    .then(data => {
        if (!data.success) return;
        currentStandards = data.standards || [];
        renderExamStandards();
        
        // 기존 수행평가 영역의 성취기준 체크박스도 갱신
        const perfContainer = document.getElementById('perfContainer');
        if (perfContainer.children.length === 0) {
            addPerfArea(); // 초기 1개 영역 추가
        } else {
            refreshAllPerfStandards();
        }
    });
}

function renderExamStandards() {
    const e1 = document.getElementById('exam1Standards');
    const e2 = document.getElementById('exam2Standards');
    e1.innerHTML = ''; e2.innerHTML = '';

    currentStandards.forEach((std, i) => {
        e1.innerHTML += `<div class="form-check"><input class="form-check-input exam1-std" type="checkbox" value="${std}" id="e1_${i}"><label class="form-check-label" for="e1_${i}">${std}</label></div>`;
        e2.innerHTML += `<div class="form-check"><input class="form-check-input exam2-std" type="checkbox" value="${std}" id="e2_${i}"><label class="form-check-label" for="e2_${i}">${std}</label></div>`;
    });
}

function addPerfArea() {
    perfCount++;
    const id = perfCount;
    const html = `
    <div class="perf-card" id="perf_card_${id}">
        <span class="btn-remove" onclick="removePerfArea(${id})">&times;</span>
        <h6 class="fw-bold text-primary mb-3">수행평가 영역 ${id}</h6>
        <div class="row g-3 mb-3">
            <div class="col-md-5">
                <label class="form-label">영역명 (비워두면 AI가 성취기준에 맞게 자동생성)</label>
                <input type="text" class="form-control perf-name" placeholder="예: 서술형 평가, 포트폴리오">
            </div>
            <div class="col-md-3">
                <label class="form-label">반영 비율 (%)</label>
                <input type="number" class="form-control perf-ratio" value="20" min="0" max="100">
            </div>
            <div class="col-md-4">
                <label class="form-label">영역 기본점수 (점)</label>
                <input type="number" class="form-control perf-base-score" value="0" min="0" placeholder="기본점수">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">선택 성취기준</label>
            <div class="perf-standards border p-2 bg-light rounded" style="max-height: 120px; overflow-y: auto;">
                ${getStandardsCheckboxesHtml(id)}
            </div>
        </div>

        <div class="mb-2 d-flex justify-content-between align-items-center">
            <label class="form-label fw-bold mb-0">세부 평가 요소 및 배점 설정</label>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addEvalElement(${id})">+ 평가 요소 추가</button>
        </div>
        <div class="table-responsive">
            <table class="table table-sm table-bordered text-center align-middle">
                <thead class="table-light">
                    <tr>
                        <th>평가 요소명</th>
                        <th style="width: 100px;">최고점</th>
                        <th style="width: 100px;">최저점</th>
                        <th style="width: 100px;">급간</th>
                        <th style="width: 50px;">삭제</th>
                    </tr>
                </thead>
                <tbody id="elem_tbody_${id}">
                    <!-- 기본 요소 1개 -->
                    <tr>
                        <td><input type="text" class="form-control form-control-sm elem-name" placeholder="예: 개념 이해 및 식 세우기"></td>
                        <td><input type="number" class="form-control form-control-sm elem-max" value="5"></td>
                        <td><input type="number" class="form-control form-control-sm elem-min" value="1"></td>
                        <td><input type="number" class="form-control form-control-sm elem-step" value="2" placeholder="급간"></td>
                        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">&times;</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>`;
    document.getElementById('perfContainer').insertAdjacentHTML('beforeend', html);
}

function getStandardsCheckboxesHtml(perfId) {
    return currentStandards.map((std, i) => `
        <div class="form-check">
            <input class="form-check-input perf-std-${perfId}" type="checkbox" value="${std}" id="p_${perfId}_${i}">
            <label class="form-check-label" for="p_${perfId}_${i}">${std}</label>
        </div>
    `).join('');
}

function refreshAllPerfStandards() {
    const cards = document.querySelectorAll('.perf-card');
    cards.forEach(card => {
        const id = card.id.replace('perf_card_', '');
        const stdBox = card.querySelector('.perf-standards');
        if (stdBox) {
            stdBox.innerHTML = getStandardsCheckboxesHtml(id);
        }
    });
}

function addEvalElement(perfId) {
    const tbody = document.getElementById(`elem_tbody_${perfId}`);
    const html = `
    <tr>
        <td><input type="text" class="form-control form-control-sm elem-name" placeholder="세부 평가 요소명"></td>
        <td><input type="number" class="form-control form-control-sm elem-max" value="5"></td>
        <td><input type="number" class="form-control form-control-sm elem-min" value="1"></td>
        <td><input type="number" class="form-control form-control-sm elem-step" value="2"></td>
        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">&times;</button></td>
    </tr>`;
    tbody.insertAdjacentHTML('beforeend', html);
}

function removePerfArea(id) {
    const card = document.getElementById(`perf_card_${id}`);
    if (card) card.remove();
}

function submitForm() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) {
        alert('Gemini API 키를 입력해주세요.');
        return;
    }

    const exam1Ratio = parseInt(document.getElementById('exam1Ratio').value || 0);
    const exam2Ratio = parseInt(document.getElementById('exam2Ratio').value || 0);

    const exam1Stds = Array.from(document.querySelectorAll('.exam1-std:checked')).map(c => c.value);
    const exam2Stds = Array.from(document.querySelectorAll('.exam2-std:checked')).map(c => c.value);

    const perfCards = document.querySelectorAll('.perf-card');
    const perfList = [];

    perfCards.forEach(card => {
        const perfId = card.id.replace('perf_card_', '');
        const name = card.querySelector('.perf-name').value.trim();
        const ratio = parseInt(card.querySelector('.perf-ratio').value || 0);
        const baseScore = parseInt(card.querySelector('.perf-base-score').value || 0);

        const stds = Array.from(card.querySelectorAll(`.perf-std-${perfId}:checked`)).map(c => c.value);

        const elemRows = card.querySelectorAll(`#elem_tbody_${perfId} tr`);
        const evalElements = [];

        elemRows.forEach(row => {
            evalElements.push({
                name: row.querySelector('.elem-name').value.trim(),
                maxScore: parseInt(row.querySelector('.elem-max').value || 5),
                minScore: parseInt(row.querySelector('.elem-min').value || 1),
                step: parseInt(row.querySelector('.elem-step').value || 2)
            });
        });

        perfList.push({
            name: name,
            ratio: ratio,
            baseScore: baseScore,
            standards: stds,
            evalElements: evalElements
        });
    });

    const formData = new FormData();
    formData.append('apiKey', apiKey);
    formData.append('schoolType', document.getElementById('schoolType').value);
    formData.append('grade', document.getElementById('grade').value);
    formData.append('semester', document.getElementById('semester').value);
    formData.append('교과', document.getElementById('mainSubject').value);
    formData.append('세부교과', document.getElementById('detailSubject').value);
    formData.append('examRatios', JSON.stringify([exam1Ratio, exam2Ratio]));
    formData.append('examStandards', JSON.stringify({
        '1차 정기시험': exam1Stds,
        '2차 정기시험': exam2Stds
    }));
    formData.append('perfList', JSON.stringify(perfList));

    document.getElementById('loadingOverlay').style.display = 'flex';

    fetch('/generate', {
        method: 'POST',
        body: formData
    })
    .then(response => {
        document.getElementById('loadingOverlay').style.display = 'none';
        if (response.ok) {
            return response.blob().then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `평가계획서_${document.getElementById('detailSubject').value || document.getElementById('mainSubject').value}.docx`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            });
        } else {
            return response.json().then(err => {
                alert('생성 실패: ' + (err.error || '오류가 발생했습니다.'));
            });
        }
    })
    .catch(err => {
        document.getElementById('loadingOverlay').style.display = 'none';
        alert('요청 중 오류 발생: ' + err);
    });
}
</script>
</body>
</html>
